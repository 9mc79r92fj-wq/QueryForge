name: queryforge

x-app-common: &app-common
  image: ${QUERYFORGE_IMAGE:-queryforge-local:latest}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - path: ${QUERYFORGE_ENV_FILE:-.env}
      required: false
  environment: &app-environment
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    QDRANT_URL: http://qdrant:6333
    DATA_DIR: /app/data
    DATABASE_URL: sqlite:////app/data/queryforge.db
    HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
  volumes:
    - app_data:/app/data
  networks:
    - queryforge_network
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_BIND_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - queryforge_network

  api:
    <<: *app-common
    ports:
      - "127.0.0.1:${API_BIND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from app.config import get_settings; from urllib.request import urlopen; urlopen('http://127.0.0.1:8000' + get_settings().api_prefix + '/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  worker:
    <<: *app-common
    environment:
      <<: *app-environment
      LLM_API_KEY: ""
      DEMO_RAG_ENABLED: "false"
      DEMO_ADMIN_TOKEN: ""
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    stop_grace_period: 11m
    mem_limit: 2560m
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping --destination \"celery@$$HOSTNAME\" --timeout=3 >/dev/null"]
      interval: 45s
      timeout: 8s
      retries: 3
      start_period: 25s
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      api:
        condition: service_healthy
  qdrant:
    image: qdrant/qdrant:v1.20.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_BIND_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3; read -r line <&3; [[ \"$$line\" == *' 200 '* ]]"]
      interval: 10s
      timeout: 3s
      retries: 6
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - queryforge_network

volumes:
  app_data:
  redis_data:
  qdrant_data:

networks:
  queryforge_network:
    driver: bridge
